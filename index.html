<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>License Admin</title>
<style>
body{font-family:system-ui,sans-serif;max-width:1100px;margin:30px auto;padding:0 16px;background:#f6f7f9}
.card{background:white;padding:20px;border-radius:14px;margin-bottom:16px;box-shadow:0 2px 12px #0001}
input,select,button{padding:10px;margin:4px;border:1px solid #ccc;border-radius:8px}
button{cursor:pointer}.hidden{display:none}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:right}
.badge{padding:3px 7px;border-radius:8px;background:#eee}
</style>
</head>
<body>
<h1>لوحة إدارة المفاتيح</h1>

<div id="login" class="card">
<h3>تسجيل دخول الأدمن</h3>
<input id="u" placeholder="اسم المستخدم">
<input id="p" type="password" placeholder="كلمة المرور">
<button onclick="login()">دخول</button>
<p id="le"></p>
</div>

<div id="panel" class="hidden">
<div class="card">
<button onclick="logout()">خروج</button>
<h3>إنشاء مفتاح</h3>
<select id="type"><option value="user">User</option><option value="admin">Admin</option></select>
<input id="key" placeholder="اتركه فارغًا للتوليد">
<input id="uses" type="number" min="1" value="1" placeholder="Max uses">
<input id="exp" type="datetime-local">
<input id="note" placeholder="ملاحظة">
<button onclick="createKey()">إنشاء</button>
</div>

<div class="card">
<h3>المفاتيح</h3>
<button onclick="load()">تحديث</button>
<table><thead><tr><th>Key</th><th>Type</th><th>Active</th><th>Uses</th><th>Expiry</th><th>إجراء</th></tr></thead>
<tbody id="rows"></tbody></table>
</div>
</div>

<script>
async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'error');return d}
async function login(){try{await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:u.value,password:p.value})});loginBox(false);load()}catch(e){le.textContent=e.message}}
function loginBox(ok){login.classList.toggle('hidden',ok);panel.classList.toggle('hidden',!ok)}
async function logout(){await api('/api/auth/logout',{method:'POST'});loginBox(true)}
async function createKey(){try{let d=await api('/api/admin/licenses',{method:'POST',body:JSON.stringify({type:type.value,key:key.value,max_uses:Number(uses.value),expires_at:exp.value?new Date(exp.value).toISOString():null,note:note.value})});alert('تم: '+d.key);load()}catch(e){alert(e.message)}}
async function load(){try{let a=await api('/api/admin/licenses');loginBox(true);rows.innerHTML=a.map(x=>`<tr><td><b>${x.key}</b></td><td>${x.type}</td><td>${x.active?'✅':'❌'}</td><td>${x.used_count}/${x.max_uses}</td><td>${x.expires_at||'—'}</td><td><button onclick="toggle(${x.id},${x.active})">${x.active?'تعطيل':'تفعيل'}</button><button onclick="del(${x.id})">حذف</button></td></tr>`).join('')}catch(e){loginBox(false)}}
async function toggle(id,a){await api('/api/admin/licenses/'+id,{method:'PATCH',body:JSON.stringify({active:!a})});load()}
async function del(id){if(confirm('حذف المفتاح؟')){await api('/api/admin/licenses/'+id,{method:'DELETE'});load()}}
</script>
</body>
</html>
